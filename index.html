<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=http://localhost:3000/" />
  <title>Redirigiendo a Mi Repositorio...</title>
  <style>
    body {
      background-color: #0a0c10;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #12151d;
      border: 1px solid rgba(251, 191, 36, 0.3);
      padding: 2rem 2.5rem;
      border-radius: 1.25rem;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 1.5rem;
      color: #fbbf24;
      margin-bottom: 0.75rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    a.button {
      display: inline-block;
      background: linear-gradient(135deg, #f59e0b, #fbbf24);
      color: #000;
      font-weight: 700;
      padding: 0.85rem 1.75rem;
      border-radius: 0.75rem;
      text-decoration: none;
      transition: transform 0.15s;
    }
    a.button:hover {
      transform: scale(1.03);
    }
  </style>
  <script>
    window.location.replace("http://localhost:3000/");
  </script>
</head>
<body>
  <div class="card">
    <h1>🚀 MI REPOSITORIO</h1>
    <p>Redirigiendo a tu aplicación local en <strong>http://localhost:3000</strong>...</p>
    <a href="http://localhost:3000/" class="button">Entrar a http://localhost:3000</a>
  </div>
</body>
</html>
